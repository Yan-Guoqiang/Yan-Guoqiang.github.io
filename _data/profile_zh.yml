short_bio: >-
  <p>
    我的学术背景具有鲜明的跨学科特色。硕士阶段主要从事基于流动人口的家庭经济学研究；在公共管理学博士培养中，我同时接受了本学科课程训练和社会学学术指导。这种跨学科背景使我呈现出两条主要的研究脉络：
  </p>

short_bio_collapsed: >-
  <h6><strong>1. 公共政策研究脉络</strong></h6>
  <p>
    从政策评估出发，逐步转向政策叙事与公众感知研究。早期运用交错DID方法评估自贸区政策效应（<em>南京审计大学学报</em>，CSSCI扩展版）；后聚焦于叙事政策框架（NPF），研究社交媒体上的政策叙事与数字参与（<em>Review of Policy Research</em>，JCR Q1）；同时关注养老服务政策协同对老年健康差距的影响（<em>财贸研究</em>，CSSCI）。
  </p>

  <h6><strong>2. 家庭与人口研究脉络</strong></h6>
  <p>
    以流动人口为核心，从经济学视角拓展至社会学理论框架。运用中国流动人口动态监测调查数据，研究数字普惠金融对流动人口健康的影响（<em>Applied Economics</em>，JCR Q2）以及家庭导向迁移与城市创业的关系（<em>Review of Economics of the Household</em>，JCR Q2）。2026年8月起将赴新加坡国立大学家庭与人口研究中心开展流动人口金融脆弱性研究。
  </p>

