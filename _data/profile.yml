short_bio_text_justify: false
short_bio: >-
  <p>
    I am a Ph.D. candidate in Public Management at <a href="https://www.seu.edu.cn/" target="_blank">Southeast University</a>.
    In my public administration doctoral program, I received both disciplinary training and sociological guidance. This interdisciplinary background has generated two main research threads:
  </p>

short_bio_collapsed: >-
  <h6><strong>1. Public Policy Research Track</strong></h6>
  <p>
    Starting from policy evaluation, I gradually shifted toward policy narratives and public perception. Early work employed staggered DID methods to evaluate Free Trade Zone policies (<em>Journal of Nanjing Audit University</em>, CSSCI Extended). I then focused on the Narrative Policy Framework (NPF), studying policy narratives and digital engagement on social media (<em>Review of Policy Research</em>, JCR Q1). I also examine the synergistic effects of elderly care pilot policies on health disparities (<em>Finance and Trade Research</em>, CSSCI).
  </p>

  <h6><strong>2. Family and Population Research Track</strong></h6>
  <p>
    Centering on migrant populations, I expanded from economic perspectives to sociological frameworks. Using the China Migrants Dynamic Survey, I studied the impact of digital inclusive finance on migrant health (<em>Applied Economics</em>, JCR Q2) and the relationship between family-oriented migration and urban entrepreneurship (<em>Review of Economics of the Household</em>, JCR Q2). Starting August 2026, I will conduct research on migrant financial vulnerability at the Centre for Family and Population Research, National University of Singapore.
  </p>

